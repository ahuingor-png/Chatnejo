<!DOCTYPE html>
<html lang="es" translate="no">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chatnejo</title>
  <meta name="google" content="notranslate">
  <meta name="theme-color" content="#0a6a52">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet">
  <style id="chatplus-theme">:root{--g:#0b9468;--g2:#0a7d58;--gd:#0a5f4a;--gl:#16a35b;--ink:#0e1b3a;--mut:#5b6b7b;--line:#e1eae6;--mint:#e2f6ec;--out:#d9f6c4;--bg:#fbfdfc;--blue:#2f7df6;--purple:#6d4df2;--head:linear-gradient(135deg,#0a6a52,#0b8a63)}
*,*::before,*::after{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body,#root{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit;padding:0}
input{font:inherit;color:inherit}
h1,h2,h3,p{margin:0}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-thumb{background:#c4dcd2;border-radius:10px}

/* ---------- marca ---------- */
.cp-word{font-family:'Poppins','Inter',sans-serif;font-weight:800;font-size:clamp(46px,14vw,62px);letter-spacing:-.035em;line-height:1;color:var(--ink);display:inline-flex}
.cp-word span:last-child{color:var(--gl)}
.cp-word-sm{font-size:24px;color:#fff;letter-spacing:-.02em}
.cp-word-sm span:last-child{color:#9bf0c0}

/* ---------- páginas (bienvenida / login / registro) ---------- */
.cp-page{min-height:100vh;min-height:100dvh;display:flex;justify-content:center;background:radial-gradient(1200px 500px at 50% -10%,#eefaf4 0,transparent 70%),var(--bg);padding-top:env(safe-area-inset-top)}
.cp-center{align-items:center}
.cp-welcome{width:100%;max-width:440px;display:flex;flex-direction:column;align-items:center;padding:16px 20px calc(22px + env(safe-area-inset-bottom));min-height:100vh;min-height:100dvh}
.cp-brand{display:flex;flex-direction:column;align-items:center;text-align:center}
.cp-brand svg{margin-bottom:6px;animation:cpPop .6s cubic-bezier(.2,1.4,.4,1) both}
.cp-tag{font-size:clamp(18px,5.4vw,22px);color:#46566a;font-weight:500;line-height:1.25;margin-top:12px}
.cp-feats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;width:100%;margin:10px 0 22px;text-align:center}
.cp-feat i{display:grid;place-items:center;width:60px;height:60px;border-radius:50%;margin:0 auto 9px}
.cp-feat b{display:block;font-size:13px;font-weight:700;color:#1d3a5a;line-height:1.25}
.cp-feat small{display:block;font-size:12.5px;color:var(--mut);line-height:1.3;margin-top:2px}
.cp-cta{width:100%;display:flex;flex-direction:column;gap:12px;margin-top:auto}
.cp-btn{height:54px;border-radius:999px;font-weight:600;font-size:18px;width:100%;transition:transform .12s,background .15s,box-shadow .15s;display:flex;align-items:center;justify-content:center;gap:8px}
.cp-btn:active{transform:scale(.98)}
.cp-btn-fill{background:var(--g);color:#fff;box-shadow:0 8px 20px rgba(11,148,104,.28)}
.cp-btn-fill:hover{background:var(--g2)}
.cp-btn-fill:disabled{background:#b6dacd;box-shadow:none;cursor:not-allowed}
.cp-btn-line{border:2px solid #25a583;color:var(--g);background:#fff}
.cp-btn-line:hover{background:#f2fbf7}
.cp-btn-red{background:#e5484d;color:#fff}
.cp-btn-soft{background:#eef4f1;color:var(--ink)}
.cp-btn-sm{height:46px;font-size:15.5px}

/* ilustración principal */
.cp-hero{position:relative;width:340px;height:300px;margin:auto;flex:none}
.cp-blob{position:absolute;left:8px;top:22px;width:324px;height:256px;background:#e4f6ee;border-radius:58% 42% 55% 45%/52% 55% 45% 48%}
.cp-ground{position:absolute;left:40px;bottom:6px;width:262px;height:22px;background:#d6ece3;border-radius:50%}
.cp-phone{position:absolute;left:90px;top:8px;width:166px;height:268px;border:6px solid #14263d;border-radius:28px;background:#f6faf8;transform:rotate(7deg);overflow:hidden;box-shadow:0 16px 30px rgba(14,27,58,.28)}
.cp-ph-head{height:44px;background:#0b6a54;color:#fff;display:flex;align-items:center;gap:6px;padding:0 8px}
.cp-ph-head img{width:24px;height:24px;border-radius:50%;object-fit:cover}
.cp-ph-head b{display:block;font-size:11px;line-height:1.1}
.cp-ph-head small{font-size:8px;opacity:.85}
.cp-ph-body{padding:9px 7px;display:flex;flex-direction:column;gap:7px}
.cp-ph-m{max-width:80%;font-size:10.5px;padding:5px 8px 12px;border-radius:9px;position:relative;line-height:1.2}
.cp-ph-m i{position:absolute;right:6px;bottom:2px;font-size:7.5px;color:#8a98a3;font-style:normal}
.cp-ph-m.in{background:#e8eef3;align-self:flex-start;border-top-left-radius:2px}
.cp-ph-m.out{background:#d5f3bd;align-self:flex-end;border-top-right-radius:2px}
.cp-ph-foot{position:absolute;left:6px;right:6px;bottom:7px;height:32px;background:#fff;border-radius:999px;box-shadow:0 1px 4px rgba(0,0,0,.12);display:flex;align-items:center;padding:0 4px 0 9px;gap:5px;font-size:8.5px;color:#7a8794}
.cp-ph-foot span{flex:1}
.cp-ph-foot u{width:23px;height:23px;border-radius:50%;background:var(--g);display:grid;place-items:center}
.cp-deco{position:absolute}
.cp-b-heart{left:2px;top:62px;width:66px;height:58px;transform:rotate(-8deg)}
.cp-emoji{left:36px;top:178px;width:52px;height:52px}
.cp-leaf{left:2px;top:196px;width:76px;height:84px}
.cp-b-blue{right:-2px;top:52px;width:72px;height:54px;transform:rotate(8deg)}
.cp-photo{right:2px;top:176px;width:76px;height:76px;transform:rotate(9deg)}
@media(max-width:370px){.cp-hero{transform:scale(.88);margin:-8px auto -22px}}

/* formularios */
.cp-auth{width:100%;max-width:440px;padding:calc(10px) 22px calc(28px + env(safe-area-inset-bottom));display:flex;flex-direction:column}
.cp-auth-head{display:flex;flex-direction:column;align-items:center;text-align:center;margin:6px 0 26px}
.cp-auth-head h1{font:800 27px 'Poppins',sans-serif;letter-spacing:-.02em;margin-top:14px}
.cp-auth-head p{color:var(--mut);margin-top:4px;font-size:15px}
.cp-label{font-weight:600;font-size:14px;margin:0 0 8px 4px}
.cp-field{display:flex;align-items:center;gap:8px;height:54px;border:1.5px solid var(--line);border-radius:999px;padding:0 18px;background:#fff;transition:border-color .15s,box-shadow .15s}
.cp-field:focus-within{border-color:var(--g);box-shadow:0 0 0 4px rgba(11,148,104,.12)}
.cp-field input{flex:1;border:0;outline:0;background:transparent;font-size:16px;min-width:0}
.cp-field .at{color:var(--g);font-weight:700}
.cp-field small{color:#97a4b0;font-size:12px}
.cp-hint{font-size:12.5px;margin:8px 4px 0;color:#7a8794}
.cp-hint .ok{color:#0b8a5f;font-weight:600}
.cp-hint .warn{color:#b45309}
.cp-err{margin:10px 2px 0;color:#b33a0c;font-size:13.5px;background:#fff4ec;border:1px solid #ffd9bf;border-radius:14px;padding:9px 13px}
.cp-switch{text-align:center;margin-top:18px;color:var(--mut);font-size:14.5px}
.cp-switch button{color:var(--g);font-weight:700}
.cp-me-av{width:92px;height:92px;border-radius:50%;background:var(--mint);border:3px solid #fff;box-shadow:0 0 0 3px #bfe7d6,0 10px 22px rgba(11,148,104,.18);overflow:hidden;display:grid;place-items:center;margin:0 auto 6px;color:#7fb9a2}
.cp-me-av img{width:100%;height:100%;object-fit:cover}
.cp-avgrid{flex:none;display:grid;grid-template-columns:repeat(4,1fr);gap:10px;max-height:290px;overflow-y:auto;padding:6px;margin:6px -6px 0}
.cp-av{flex:none;width:100%;position:relative;height:0;padding-bottom:100%;border-radius:50%;overflow:hidden;background:var(--mint);transition:transform .12s}
.cp-av:hover{transform:scale(1.04)}
.cp-av.on{box-shadow:0 0 0 3px var(--g),0 0 0 6px rgba(11,148,104,.22)}
.cp-av img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.cp-av b{position:absolute;right:2px;bottom:2px;width:20px;height:20px;border-radius:50%;background:var(--g);color:#fff;display:grid;place-items:center;font-size:11px;border:2px solid #fff}
.cp-sec{font:700 15px 'Poppins',sans-serif;margin:22px 4px 0}
.cp-note{font-size:12.5px;color:var(--mut);margin:2px 4px 6px}

/* splash */
.cp-splash{display:flex;flex-direction:column;align-items:center;gap:14px}
.cp-splash svg{animation:cpBob 1s ease-in-out infinite}
.cp-dots{display:flex;gap:6px}
.cp-dots i{width:9px;height:9px;border-radius:50%;background:var(--gl);animation:cpBounce 1s infinite}
.cp-dots i:nth-child(2){animation-delay:.15s;opacity:.7}
.cp-dots i:nth-child(3){animation-delay:.3s;opacity:.45}

/* ---------- app ---------- */
.cp-app{display:flex;height:100vh;height:100dvh;width:100%;max-width:1440px;margin:0 auto;background:#fff;position:relative;overflow:hidden}
.cp-side{width:380px;flex:none;display:flex;flex-direction:column;background:#fff;border-right:1px solid var(--line);position:relative;min-height:0}
.cp-top{background:var(--head);color:#fff;padding:calc(12px + env(safe-area-inset-top)) 14px 12px;display:flex;align-items:center;justify-content:space-between;flex:none}
.cp-top-brand{display:flex;align-items:center;gap:8px}
.cp-avbtn{width:42px;height:42px;border-radius:50%;overflow:hidden;border:2px solid rgba(255,255,255,.6);flex:none;background:var(--mint)}
.cp-avbtn img{width:100%;height:100%;object-fit:cover;display:block}
.cp-codebar{display:flex;align-items:center;gap:10px;margin:12px 14px 4px;padding:10px 14px;border-radius:16px;background:var(--mint);width:calc(100% - 28px);text-align:left;flex:none}
.cp-codebar small{font-size:12px;color:var(--mut)}
.cp-codebar b{letter-spacing:.08em;color:var(--gd);font-size:14px}
.cp-codebar em{margin-left:auto;font-style:normal;font-size:12px;font-weight:700;color:var(--g)}
.cp-list{flex:1;overflow-y:auto;padding:6px 8px 96px}
.cp-item{display:flex;gap:12px;align-items:center;width:100%;text-align:left;padding:10px;border-radius:16px;transition:background .12s}
.cp-item:hover{background:#f3f8f6}
.cp-item.on{background:var(--mint)}
.cp-item img{width:52px;height:52px;border-radius:50%;object-fit:cover;flex:none;background:var(--mint)}
.cp-item-main{min-width:0;flex:1}
.cp-item-row{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.cp-item-name{font-weight:700;font-size:15.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cp-item-row time{font-size:12px;color:var(--mut);flex:none}
.cp-item-last{font-size:13.5px;color:var(--mut);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:2px}
.cp-fab{position:absolute;right:18px;bottom:calc(18px + env(safe-area-inset-bottom));width:58px;height:58px;border-radius:50%;background:var(--g);color:#fff;display:grid;place-items:center;box-shadow:0 10px 24px rgba(11,148,104,.4);transition:transform .12s}
.cp-fab:active{transform:scale(.94)}
.cp-empty{text-align:center;padding:34px 18px}
.cp-empty h3{font:700 17px 'Poppins',sans-serif;margin-top:14px}
.cp-empty p{font-size:13.5px;color:var(--mut);line-height:1.5;margin-top:6px}
.cp-empty p b{color:var(--gd);letter-spacing:.06em}
.cp-steps{margin:18px 0 0;padding:14px 16px 14px 34px;background:#f5faf8;border:1px dashed #bcdccf;border-radius:16px;text-align:left;font-size:13px;color:#33495a;line-height:1.55}

.cp-main{flex:1;min-width:0;display:flex;flex-direction:column;background:#e9f2ee;position:relative}
.cp-chead{display:flex;align-items:center;gap:10px;background:var(--head);color:#fff;padding:calc(10px + env(safe-area-inset-top)) 10px 10px 8px;flex:none}
.cp-chead>img{width:42px;height:42px;border-radius:50%;object-fit:cover;border:2px solid rgba(255,255,255,.55);background:var(--mint)}
.cp-chead h2{font:700 16.5px 'Poppins',sans-serif;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cp-chead small{display:block;opacity:.82;font-size:12px;letter-spacing:.05em;margin-top:1px}
.cp-who{min-width:0;flex:1}
.cp-iconbtn{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;color:inherit;flex:none;transition:background .12s}
.cp-iconbtn:hover{background:rgba(255,255,255,.16)}
.cp-iconbtn.cp-dark:hover{background:var(--mint)}
.cp-msgs{flex:1;overflow-y:auto;padding:14px 12px 10px;display:flex;flex-direction:column;gap:5px;background-color:#e9f2ee;background-image:radial-gradient(rgba(11,148,104,.09) 1.6px,transparent 1.7px);background-size:24px 24px}
.cp-chip{align-self:center;background:rgba(255,255,255,.9);color:var(--mut);font-size:12px;padding:4px 12px;border-radius:999px;margin:4px 0 8px;box-shadow:0 1px 1px rgba(0,0,0,.05)}
.cp-msg{max-width:min(80%,520px);padding:7px 10px 5px;border-radius:15px;font-size:15px;line-height:1.38;box-shadow:0 1px 1px rgba(10,40,30,.1);animation:cpIn .18s ease-out both}
.cp-msg.in{background:#fff;align-self:flex-start;border-bottom-left-radius:4px}
.cp-msg.out{background:var(--out);align-self:flex-end;border-bottom-right-radius:4px}
.cp-msg p{white-space:pre-wrap;word-break:break-word}
.cp-msg img{display:block;border-radius:11px;max-height:280px;max-width:100%;width:auto;cursor:zoom-in;margin-bottom:3px}
.cp-msg audio{width:236px;max-width:100%;height:40px;display:block}
.cp-time{display:flex;justify-content:flex-end;align-items:center;gap:3px;font-size:10.5px;color:#6a7b75;margin-top:2px}
.cp-time svg{color:#3f9a85}
.cp-comp{background:#f1f5f3;padding:8px 10px calc(8px + env(safe-area-inset-bottom));display:flex;gap:8px;align-items:center;flex:none;position:relative}
.cp-pill{flex:1;display:flex;align-items:center;gap:6px;background:#fff;border-radius:999px;height:48px;padding:0 6px 0 8px;box-shadow:0 1px 2px rgba(10,40,30,.08);min-width:0}
.cp-pill input.txt{flex:1;border:0;outline:0;background:transparent;font-size:15.5px;min-width:0;padding:0 4px}
.cp-pill input.txt::placeholder{color:#8a98a3}
.cp-pill .cp-ib{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;color:#6b7c76;flex:none;cursor:pointer}
.cp-pill .cp-ib:hover{background:#eef4f1;color:var(--g)}
.cp-send{width:48px;height:48px;border-radius:50%;background:var(--g);color:#fff;display:grid;place-items:center;flex:none;box-shadow:0 6px 14px rgba(11,148,104,.35);transition:transform .12s}
.cp-send:active{transform:scale(.93)}
.cp-rec{flex:1;height:48px;border-radius:999px;background:#fff1f1;border:1px solid #ffd0d0;color:#d33;display:flex;align-items:center;gap:9px;padding:0 16px;font-size:15px}
.cp-rec i{width:10px;height:10px;border-radius:50%;background:#e5484d;animation:cpPulse 1s infinite}
.cp-emoji-pop{position:absolute;left:10px;bottom:calc(64px + env(safe-area-inset-bottom));background:#fff;border-radius:18px;box-shadow:0 12px 34px rgba(10,40,30,.22);padding:8px;display:grid;grid-template-columns:repeat(7,1fr);gap:2px;z-index:5;width:min(330px,calc(100% - 20px))}
.cp-emoji-pop button{font-size:23px;height:40px;border-radius:10px}
.cp-emoji-pop button:hover{background:var(--mint)}
.cp-busy{font-size:12px;color:var(--mut);text-align:center;padding:2px 0 6px;background:#f1f5f3}
.cp-blank{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:28px;background:linear-gradient(#f3faf7,#e9f2ee)}
.cp-blank .cp-word{font-size:44px;margin-top:12px}
.cp-blank p{color:#46566a;margin-top:10px;font-size:16px}
.cp-pillcode{margin-top:22px;display:inline-flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--line);border-radius:999px;padding:7px 8px 7px 8px;box-shadow:0 4px 14px rgba(10,40,30,.06)}
.cp-pillcode img{width:30px;height:30px;border-radius:50%;object-fit:cover}
.cp-pillcode b{font-size:13.5px}
.cp-pillcode span{font-size:12.5px;font-weight:700;letter-spacing:.07em;color:var(--gd)}
.cp-pillcode button{font-size:12px;font-weight:700;color:#fff;background:var(--g);border-radius:999px;padding:5px 12px}

/* paneles */
.cp-ov{position:fixed;inset:0;z-index:50;display:flex;background:rgba(8,28,22,.42);backdrop-filter:blur(2px);animation:cpFade .18s ease}
.cp-ov.mid{align-items:center;justify-content:center;padding:18px}
.cp-ov.dark{background:rgba(0,0,0,.88);align-items:center;justify-content:center;padding:12px}
.cp-ov.dark img{max-width:100%;max-height:100%;border-radius:12px}
.cp-drawer{margin-left:auto;width:340px;max-width:90vw;background:#fff;height:100%;overflow-y:auto;animation:cpSlide .25s ease}
.cp-dhead{background:var(--head);color:#fff;padding:calc(18px + env(safe-area-inset-top)) 20px 26px;text-align:center;position:relative}
.cp-dhead .cp-iconbtn{position:absolute;right:8px;top:calc(8px + env(safe-area-inset-top))}
.cp-dhead>img{width:104px;height:104px;border-radius:50%;object-fit:cover;border:4px solid rgba(255,255,255,.7);margin-top:8px;background:var(--mint)}
.cp-dhead h3{font:700 21px 'Poppins',sans-serif;margin-top:12px}
.cp-dbody{padding:20px}
.cp-code-card{background:var(--mint);border-radius:18px;padding:14px 16px;text-align:center}
.cp-code-card small{font-size:12px;color:var(--mut);font-weight:600}
.cp-code-card b{display:block;font:700 22px 'Poppins',sans-serif;letter-spacing:.1em;color:var(--gd);margin:2px 0 4px}
.cp-code-card p{font-size:12.5px;color:var(--mut);line-height:1.4}
.cp-stack{display:flex;flex-direction:column;gap:10px;margin-top:18px}
.cp-modal{width:100%;max-width:384px;background:#fff;border-radius:24px;padding:22px;box-shadow:0 24px 60px rgba(0,0,0,.25);animation:cpPop .25s cubic-bezier(.2,1.3,.4,1) both}
.cp-modal h3{font:700 19px 'Poppins',sans-serif}
.cp-modal>p{font-size:14px;color:var(--mut);margin-top:4px;line-height:1.45}
.cp-modal .cp-field input{font-family:ui-monospace,Menlo,monospace;font-weight:700;letter-spacing:.1em;text-transform:uppercase}
.cp-modal .row{display:flex;gap:10px;margin-top:18px}
.cp-modal-head{display:flex;align-items:center;justify-content:space-between}
.cp-trash{width:64px;height:64px;border-radius:50%;background:#fff0f0;color:#e5484d;display:grid;place-items:center;margin:0 auto 10px}

/* ---------- móvil ---------- */
@media(max-width:719px){
  .cp-side{position:absolute;inset:0;width:100%;z-index:20;transition:transform .28s ease;border-right:0}
  .cp-side.is-hidden{transform:translateX(-100%);pointer-events:none;visibility:hidden;transition:transform .28s ease,visibility 0s .28s}
  .cp-msg{max-width:84%}
}
@media(min-width:720px){.cp-back{display:none}}

@keyframes cpPop{from{transform:scale(.8);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes cpBob{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes cpBounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
@keyframes cpFade{from{opacity:0}to{opacity:1}}
@keyframes cpSlide{from{transform:translateX(30px);opacity:0}to{transform:none;opacity:1}}
@keyframes cpIn{from{transform:translateY(6px);opacity:0}to{transform:none;opacity:1}}
@keyframes cpPulse{0%,100%{opacity:1}50%{opacity:.35}}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important}}
</style>

  --tw-pan-x:  ;

  --tw-pinch-zoom:  ;
  --tw-scroll-snap-strictness: proximity;
  --tw-gradient-from-position:  ;
  --tw-gradient-via-position:  ;
  --tw-gradient-to-position:  ;
  --tw-ordinal:  ;
  --tw-slashed-zero:  ;
  --tw-numeric-figure:  ;
